[package]
name = "wslplugins-rs"
authors.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
edition = "2021"
keywords = ["wsl", "plugin", "windows", "linux"]
categories = ["os::windows-apis", "api-bindings", "virtualization"]
readme.workspace = true

[dependencies]
windows-core = { workspace = true }
bitflags = { version = ">0.1.0", optional = true }
enumflags2 = { version = ">0.5", optional = true }
flagset = { version = ">0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1.43", optional = true }
thiserror = "2.0.7"
typed-path = ">0.1"
widestring = { version = "1", features = ["alloc"] }
wslplugins-macro = { path = "../wslplugins-macro", optional = true, version = "0.1.0-beta.4" }
wslpluginapi-sys.workspace = true
win-security-identifier.workspace = true
uuid = { version = "1", optional = true }
smallvec = { workspace = true, optional = true }
semver = { version = "1", optional = true }
strum = { workspace = true }

[dev-dependencies]
proptest = "1.9.0"
criterion = "0.8"
serde_test = "1"

[features]
default = ["smallvec"]
sys = []
smallvec = ["dep:smallvec"]
serde = ["dep:serde", "win-security-identifier/serde"]
macro = ["dep:wslplugins-macro", "sys", "dep:tracing"]
sid-macro = ["win-security-identifier/macro"]
tracing = ["dep:tracing"]
uuid = ["dep:uuid"]
semver = ["dep:semver"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[lints]
workspace = true

[[bench]]
name = "user_distribution_id_formatting"
harness = false
default = ["smallvec"]
sys = []
smallvec = ["dep:smallvec"]
