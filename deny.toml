[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0"]
exceptions = [{ allow = ["Unicode-3.0"], crate = "unicode-ident" }]

[bans]
multiple-versions = "deny"

# Independent proc-macro dependencies currently require `syn` v2 and v3.
skip = [{ name = "syn", version = ">=2, <4" }]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/mveril/wslpluginapi-sys"]
