name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Git Index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Install Rust
        shell: pwsh
        run: rustup update stable && rustup default stable

      - name: Install PSSemVer
        shell: pwsh
        run: |
          try {
            Import-Module -Name PSSemVer -ErrorAction Stop
          } catch {
            Write-Host "Installing PSSemVer module..."
            Install-Module -Name PSSemVer -Scope CurrentUser -Force -ErrorAction Stop
            Import-Module -Name PSSemVer -ErrorAction Stop
          }

      - name: Validate Tag with PSSemVer
        id: validate
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          try {
              $rawVersion = $tagName -replace '^v', ''
              $version = [PSSemVer]::Parse($rawVersion)

              if ($version.Prerelease) {
                  "prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "release_kind=prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "release_label=Prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              } else {
                  "prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "release_kind=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "release_label=Release" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              }
          } catch {
              Write-Error "Tag name does not contain a valid semantic version. Current tag: $tagName"
              exit 1
          }
        continue-on-error: false

      - name: Cargo Publish Dry-Run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --dry-run --locked

      - name: Cargo Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.validate.outputs.release_label }} ${{ github.ref_name }}
          body: |
            This is a ${{ steps.validate.outputs.release_kind }} of the workspace crates.
            Main crate: https://crates.io/crates/wslplugins-rs
          prerelease: ${{ steps.validate.outputs.prerelease == 'true' }}
