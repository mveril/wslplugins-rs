name: Create Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create tag from release branch
    if: startsWith(github.ref_name, 'release/')
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PSSemVer
        shell: pwsh
        run: |
          try {
            Import-Module -Name PSSemVer -ErrorAction Stop
          } catch {
            Write-Host "Installing PSSemVer module..."
            Install-Module -Name PSSemVer -Scope CurrentUser -Force -ErrorAction Stop
            Import-Module -Name PSSemVer -ErrorAction Stop
          }

      - name: Compute Tag Name
        id: version
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          try {
              $rawVersion = $branchName -replace '^release/', ''
              $version = [PSSemVer]::Parse($rawVersion)
              "tag_name=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
              Write-Error "Branch name does not contain a valid semantic version. Current branch: $branchName"
              exit 1
          }

      - name: Ensure Tag Does Not Exist
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git fetch --tags --force
          if (git rev-parse $env:TAG_NAME 2>$null) {
            Write-Error "Tag '$env:TAG_NAME' already exists."
            exit 1
          }

      - name: Create and Push Tag
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:TAG_NAME
          git push origin $env:TAG_NAME
