name: Rust CI for WSLPlugins-rs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-validate:
    runs-on: windows-latest

    strategy:
      matrix:
        rust: ["stable", "nightly"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (Matrix)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          target: x86_64-pc-windows-msvc
          override: true

      - name: Lint with Clippy (Stable Only)
        if: matrix.rust == 'stable'
        uses: actions-rs/clippy@v1

      - name: Check Code Formatting (Stable Only)
        if: matrix.rust == 'stable'
        uses: actions-rs/rustfmt@v1

      - name: Build the Project
        run: cargo build --verbose

      - name: Run Tests
        run: cargo test --verbose

      - name: Generate Documentation (Stable Only)
        if: matrix.rust == 'stable'
        run: cargo doc --no-deps

      - name: Generate Documentation for Docs.rs (Nightly Only)
        if: matrix.rust == 'nightly'
        run: |
          RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --no-deps

      - name: Run Security Audit (Nightly Only)
        if: matrix.rust == 'nightly'
        run: cargo audit
