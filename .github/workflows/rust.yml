name: rust
on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*

jobs:
  build-and-validate:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - toolchain: stable
            RUSTDOCFLAGS: "-D warnings"
            DOCTYPE: "docrs"
          - toolchain: nightly
            RUSTDOCFLAGS: "-D warnings --cfg docsrs"
            DOCTYPE: "doc"

    name: "Build and validate (${{ matrix.toolchain}})"
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: ${{ matrix.RUSTDOCFLAGS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Git Index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Install Rust (Matrix)
        shell: pwsh
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - name: Lint with Clippy (Stable Only)
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features

      - name: Check Code Formatting (Stable Only)
        if: matrix.toolchain == 'stable'
        run: cargo fmt -- --check

      - name: Build the Project
        run: cargo build --verbose --all-features

      - name: Run Tests
        run: cargo test --verbose --all-features

      - name: Generate Documentation (${{ matrix.DOCTYPE }}, ${{ matrix.toolchain }})
        run: cargo doc --no-deps --all-features

      - name: Install and Run cargo deny (Nightly Only)
        if: matrix.toolchain == 'nightly'
        run: |
          cargo install cargo-deny || echo "cargo-deny already installed"
          cargo deny check --show-stats

  miri:
    name: Miri (Tree Borrows, versioned FFI views)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-disable-isolation
      PROPTEST_CASES: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Miri (nightly)
        shell: pwsh
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      # The library is Windows-specific. Only run tests that exercise its
      # versioned FFI views without invoking native Win32/WSL functions:
      # Miri does not emulate all host APIs.
      - name: Check opaque FFI views with Tree Borrows
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly miri test -p wslplugins-rs --all-features --lib reads_api_version_without_newer_function_slots
          cargo +nightly miri test -p wslplugins-rs --all-features --lib opaque_view_roundtrips_native_pointer_and_reads_native_field
          cargo +nightly miri test -p wslplugins-rs --all-features --lib reads_distribution_prefix_without_newer_fields
          cargo +nightly miri test -p wslplugins-rs --all-features --lib reads_offline_prefix_without_flavor_or_version
